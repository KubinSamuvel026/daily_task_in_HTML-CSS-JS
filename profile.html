<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile-card</title>
    <link rel="stylesheet" href="profile.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="imag2.jpeg" alt="" class="profile-image">
        </div>
        <div class="text">
            <div class="data">Kubin samuvel</div>
            <div class="job"> Full Stack Developer </div>
        </div>
        <div class="buttons">
            <button class="project">My project</button>
            <button class="aboutme">About Me</button>
        </div>
        <div class="button"> 
            <a href="#" style="background-color:#4267b2 ;" class="link">
                <i class="bx bxl-facebook"></i>
            </a>
            <a href="#" style="background-color:#e1306c ;" class="link">
                <i class="bx bxl-instagram"></i>
            </a>
            <a href="#" style="background-color: #1da1f2;" class="link">
                <i class="bx bxl-twitter"></i>
            </a>
            <a href="#" style="background-color:#ff0000 ;" class="link">
                <i class="bx bxl-youtube"></i>
            </a>
            
        </div>
        <div class="likeshare">
            <i class="bx bx-heart"> 12k</i>
            <i class="bx bx-share"> 259k</i>
            <i class="bx bx-message-rounded"> 60k</i>
        </div>
       
    </div>
</body>
</html>
